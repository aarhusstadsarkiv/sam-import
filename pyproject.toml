[project]
name = "sam-import"
version = "0.1.1"
authors = [
    {name = "Simon Glob"}
]
description = "Genererer metadata for en aflevering ud fra webformularen."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jinja2>=3.1.6",
    "weasyprint>=68.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[project.scripts]
sam-import = "sam_import.main:main"